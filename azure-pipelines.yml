trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'sc-ecobite'
  resourceGroup: 'rg-ecobite-apim'
  pythonVersion: '3.11'

steps:
  - task: UsePythonVersion@0
    displayName: 'Use Python $(pythonVersion)'
    inputs:
      versionSpec: '$(pythonVersion)'
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements-dev.txt
    displayName: 'Install dependencies'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
  - script: python -m pytest -p no:cacheprovider --junitxml=$(Agent.TempDirectory)/test-results.xml
    displayName: 'Run tests (pytest)'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Agent.TempDirectory)/test-results.xml'
      testRunTitle: 'EcoBite API tests'
  - task: AzureCLI@2
    displayName: 'Deploy infrastructure (Bicep)'
    inputs:
      azureSubscription: $(azureSubscription)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az deployment group create \
          --resource-group $(resourceGroup) \
          --template-file main.bicep
        WEBAPP=$(az deployment group show \
          --resource-group $(resourceGroup) \
          --name main \
          --query properties.outputs.webAppName.value -o tsv)
        echo "##vso[task.setvariable variable=webAppName]$WEBAPP"

  - task: AzureWebApp@1
    displayName: 'Deploy backend code'
    inputs:
      azureSubscription: $(azureSubscription)
      appType: webAppLinux
      appName: $(webAppName)
      package: $(System.DefaultWorkingDirectory)
      runtimeStack: 'PYTHON|3.11'
      startUpCommand: 'python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'